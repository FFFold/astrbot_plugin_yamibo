[project]
name = "astrbot_plugin_yamibo"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9", "beautifulsoup4>=4.12", "quickjs>=1.19", "img2pdf>=0.5"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
